[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uavswarm-mission-llm-lab"
version = "0.1.0"
description = "Isolated, proposal-only UAV mission LLM experiment"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0"]

[project.scripts]
mission-llm-lab = "uavswarm_llm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uavswarm_llm_lab = ["schemas/*.json", "prompts/*.txt", "benchmarks/*.json", "benchmarks/*.jsonl"]
